name: Build tvdock.apk
on:
  workflow_dispatch:
  push:
    paths: ['launcher/**', '.github/workflows/build.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK (debug-signed, installs fine over ADB)
        working-directory: launcher
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp launcher/app/build/outputs/apk/debug/app-debug.apk tvdock.apk
      - uses: actions/upload-artifact@v4
        with: { name: tvdock-apk, path: tvdock.apk }
