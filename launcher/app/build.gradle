plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvdock.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvdock.home'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
